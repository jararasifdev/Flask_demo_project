<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }
        input {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .toggle {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">Login</h1>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>
        <button id="btn" onclick="handleSubmit()">Login</button>
        <p class="toggle" onclick="toggleMode()" id="toggle-text">Don't have an account? Register</p>
        <div id="msg" style="margin-top: 1rem; text-align: center; font-size: 0.875rem;"></div>
    </div>

    <script>
        let mode = 'login';

        function toggleMode() {
            mode = mode === 'login' ? 'register' : 'login';
            document.getElementById('title').innerText = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('btn').innerText = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('toggle-text').innerText = mode === 'login' ? "Don't have an account? Register" : "Already have an account? Login";
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            try {
                const res = await fetch(`/auth/${mode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    if (mode === 'login') {
                        localStorage.setItem('token', data.access_token);
                        window.location.href = '/';
                    } else {
                        msg.style.color = 'var(--success)';
                        msg.innerText = 'Registered! Now please login.';
                        toggleMode();
                    }
                } else {
                    msg.style.color = 'var(--error)';
                    msg.innerText = data.msg || JSON.stringify(data);
                }
            } catch (err) {
                msg.innerText = 'Error: ' + err.message;
            }
        }
    </script>
</body>
</html>
